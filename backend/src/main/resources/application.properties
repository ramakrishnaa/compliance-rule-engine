spring.application.name=compliance-evaluator
server.port=8080

# Upload limits for the REST API (customer files are expected to be small).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Sample files used by GET /api/evaluations/sample (relative to the working directory).
compliance.sample.transactions-path=../transactions.json
compliance.sample.rules-path=../rules.csv
